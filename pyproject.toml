[project]
name = "routemap-harness"
version = "0.1.0"
description = "Offline route-and-validate control layer for evaluating LLM reliability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
]
keywords = ["ai", "evaluation", "llm", "reliability", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]
benchmark = [
    "matplotlib>=3.7,<4",
    "pandas>=2,<4",
]
dev = [
    "build>=1.2,<2",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "jsonschema>=4.21,<5",
    "pytest>=8,<10",
    "tomli>=2,<3; python_version < '3.11'",
    "uvicorn>=0.27,<1",
]
matrix = [
    "accelerate>=0.34,<2",
    "transformers>=4.44,<5",
]

[project.scripts]
routemap-harness = "routemap_harness.__main__:main"

[project.urls]
Repository = "https://github.com/Northernator/routemap-eval-harness"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = [
    "dr_checker_code_v1",
    "dr_checker_framework_v1",
    "dr_checker_schema_v1",
    "dr_generate_corpus_v1",
    "dr_output_extraction_v1",
    "dr_repair_wrapper_v1",
    "dr_residue_engine_v1",
    "dr_verifier_v1",
    "llm_output_parsing",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routemap_harness = [
    "schemas/*.json",
    "web/*.html",
]
