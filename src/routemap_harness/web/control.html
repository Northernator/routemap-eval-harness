<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteMap Harness Control</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #202124;
      --muted: #626865;
      --line: #d9ddd6;
      --accent: #1d6f5f;
      --bad: #b42318;
      --good: #16794c;
      --warn: #a16207;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151714;
        --panel: #20231f;
        --text: #ecefeb;
        --muted: #a7aea8;
        --line: #3b413b;
        --accent: #70b8a8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1, h2 {
      margin: 0;
      font-weight: 680;
      letter-spacing: 0;
    }
    h1 { font-size: 1.65rem; }
    h2 { font-size: 1rem; }
    .hint { color: var(--muted); font-size: 0.9rem; }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px;
      align-items: start;
    }
    section, form {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
    }
    select, textarea, input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    select, input { min-height: 40px; padding: 8px 10px; }
    textarea {
      min-height: 260px;
      resize: vertical;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
    }
    .schema-field textarea { min-height: 112px; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      color: var(--text);
    }
    .toggle input { width: 18px; height: 18px; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      cursor: pointer;
      min-height: 40px;
      padding: 8px 12px;
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 700;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .decision {
      display: grid;
      gap: 10px;
    }
    .kv {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .kv:last-child { border-bottom: 0; }
    .key { color: var(--muted); font-size: 0.82rem; }
    .value {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 0.88rem;
    }
    .verdict-ruled_out_wrong { color: var(--bad); }
    .verdict-not_ruled_out { color: var(--good); }
    .verdict-uncheckable { color: var(--warn); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-size: 0.78rem; }
    td { overflow-wrap: anywhere; }
    .status {
      min-height: 24px;
      color: var(--muted);
      margin-top: 10px;
      font-size: 0.9rem;
    }
    @media (max-width: 880px) {
      main { width: min(100% - 20px, 760px); padding-top: 18px; }
      header, .grid { display: block; }
      .controls { grid-template-columns: 1fr; }
      section { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>RouteMap Harness Control</h1>
        <div class="hint">local verifier console</div>
      </div>
      <div class="hint">same-origin API</div>
    </header>

    <div class="grid">
      <form id="check-form">
        <div class="controls">
          <label>model
            <select id="model"></select>
          </label>
          <label>task
            <select id="task">
              <option value="auto-detect">auto-detect</option>
              <option value="arithmetic">arithmetic</option>
              <option value="json_schema">json_schema</option>
              <option value="python_code">python_code</option>
              <option value="extraction">extraction</option>
              <option value="long_context_qa">long_context_qa</option>
              <option value="retrieval">retrieval</option>
            </select>
          </label>
        </div>

        <label>model output / payload
          <textarea id="output" spellcheck="false">{ "id": "x", "score": 88, "status": "pass", "tags": ["ok"] }</textarea>
        </label>

        <label class="schema-field">optional schema
          <textarea id="spec" spellcheck="false">{
  "type": "object",
  "required": ["id", "score", "status", "tags"],
  "properties": {
    "id": { "type": "string" },
    "score": { "type": "integer", "minimum": 0, "maximum": 100 },
    "status": { "enum": ["pass", "fail"] },
    "tags": { "type": "array", "minItems": 1 }
  }
}</textarea>
        </label>

        <label class="toggle">
          <input id="strict" type="checkbox">
          strict
        </label>

        <div class="actions">
          <button id="check-btn" type="submit">check</button>
          <button id="repair-btn" class="secondary" type="button" disabled>repair</button>
        </div>
        <div id="status" class="status"></div>
      </form>

      <section>
        <h2>decision</h2>
        <div id="decision" class="decision">
          <div class="hint">No decision yet.</div>
        </div>
      </section>
    </div>

    <section>
      <h2>recent decisions</h2>
      <table>
        <thead>
          <tr>
            <th>time</th>
            <th>task</th>
            <th>model</th>
            <th>verdict</th>
            <th>final_status</th>
          </tr>
        </thead>
        <tbody id="audit-body"></tbody>
      </table>
    </section>
  </main>

  <script>
    const modelSelect = document.querySelector("#model");
    const taskSelect = document.querySelector("#task");
    const outputField = document.querySelector("#output");
    const specField = document.querySelector("#spec");
    const strictField = document.querySelector("#strict");
    const form = document.querySelector("#check-form");
    const decisionEl = document.querySelector("#decision");
    const statusEl = document.querySelector("#status");
    const repairBtn = document.querySelector("#repair-btn");
    const auditBody = document.querySelector("#audit-body");
    let lastDecisionId = "";

    async function request(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`${response.status} ${text}`);
      }
      return response.json();
    }

    function parseSpec() {
      const text = specField.value.trim();
      if (!text) return null;
      return JSON.parse(text);
    }

    function selectedModel() {
      const option = modelSelect.selectedOptions[0];
      return option ? option.value : "";
    }

    function selectedRuntime() {
      const option = modelSelect.selectedOptions[0];
      return option ? option.dataset.runtime : "";
    }

    function verdictClass(value) {
      return `verdict-${String(value || "").toLowerCase()}`;
    }

    function renderDecision(decision) {
      lastDecisionId = decision.decision_id || lastDecisionId;
      repairBtn.disabled = !lastDecisionId;
      const fields = [
        ["verdict", decision.verdict],
        ["action", decision.action],
        ["final_status", decision.final_status],
        ["validator", decision.validator],
        ["reason", decision.reason],
        ["latency_ms", decision.latency_ms],
        ["decision_id", decision.decision_id]
      ];
      decisionEl.innerHTML = fields.map(([key, value]) => {
        const cls = key === "verdict" ? verdictClass(value) : "";
        return `<div class="kv"><div class="key">${key}</div><div class="value ${cls}">${escapeHtml(value ?? "")}</div></div>`;
      }).join("");
    }

    function renderAudit(records) {
      if (!records.length) {
        auditBody.innerHTML = `<tr><td colspan="5" class="hint">No audit records found.</td></tr>`;
        return;
      }
      auditBody.innerHTML = records.map((record) => `
        <tr>
          <td>${escapeHtml(record.timestamp || "")}</td>
          <td>${escapeHtml(record.task_type || "")}</td>
          <td>${escapeHtml(record.model || "")}</td>
          <td class="${verdictClass(record.verdict)}">${escapeHtml(record.verdict || "")}</td>
          <td>${escapeHtml(record.final_status || "")}</td>
        </tr>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadModels() {
      const models = await request("/models");
      modelSelect.innerHTML = models.map((model) => {
        const disabled = model.available ? "" : "disabled";
        const label = `${model.runtime} / ${model.model_ref} - ${model.note}`;
        return `<option value="${escapeHtml(model.model_ref)}" data-runtime="${escapeHtml(model.runtime)}" ${disabled}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    async function loadAudit() {
      renderAudit(await request("/audit?limit=20"));
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "checking...";
      try {
        const task = taskSelect.value === "auto-detect" ? null : taskSelect.value;
        const decision = await request("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            task,
            model: selectedModel(),
            runtime: selectedRuntime(),
            output: outputField.value,
            spec: parseSpec(),
            strict: strictField.checked
          })
        });
        renderDecision(decision);
        await loadAudit();
        statusEl.textContent = "checked";
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    repairBtn.addEventListener("click", async () => {
      if (!lastDecisionId) return;
      statusEl.textContent = "repairing...";
      try {
        const repaired = await request("/repair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision_id: lastDecisionId, model_ref: selectedModel() })
        });
        renderDecision(repaired);
        await loadAudit();
        statusEl.textContent = "repair response rendered";
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    loadModels().catch((error) => { statusEl.textContent = error.message; });
    loadAudit().catch((error) => { statusEl.textContent = error.message; });
  </script>
</body>
</html>
