name: Feature request
description: Propose a focused reliability-harness improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Reliability problem
      description: Describe the user or evaluation problem, not only the proposed implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Harness core or policy
        - Validator lane
        - Controller or routing
        - API or cockpit
        - Evidence or benchmark
        - Packaging or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility boundaries
      description: Note audit-schema, determinism, privacy, dependency, or backward-compatibility effects
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed falsification or acceptance test
      description: Explain how the behavior could be shown wrong as well as shown working
