name: evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Public tree privacy guard
        run: python scripts/check_public_tree.py

      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Complete test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests \
            rv_test_validator_package.py \
            rd_test_digital_engine.py \
            rb_test_bench.py \
            rt_test_token.py \
            rt_test_elements.py \
            rt_test_grounding.py \
            re_test_embedding.py \
            rc_test_controller.py \
            rm_test_matrix.py

      - name: Acceptance contract
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
        run: python scripts/check_acceptance.py

      - name: Evidence runner
        if: ${{ !cancelled() }}
        run: python run_evidence.py

      - name: Upload EVIDENCE/RESULTS.md
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-results-py${{ matrix.python-version }}
          path: EVIDENCE/RESULTS.md
          if-no-files-found: error
          retention-days: 14

  # GPU matrix run (peak-VRAM / long-context) is hardware-gated and not run in CI.
  # See src/routemap_matrix/HANDOFF.md to run it on an Ampere-class GPU.
