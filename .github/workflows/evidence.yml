name: evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Complete test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests \
            rv_test_validator_package.py \
            rd_test_digital_engine.py \
            rb_test_bench.py \
            rt_test_token.py \
            rt_test_elements.py \
            rt_test_grounding.py \
            re_test_embedding.py \
            rc_test_controller.py \
            rm_test_matrix.py

      - name: Acceptance contract
        env:
          PYTHONPATH: src
        run: python scripts/check_acceptance.py

      - name: Evidence runner
        run: python run_evidence.py

      - name: Upload EVIDENCE/RESULTS.md
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-results-py${{ matrix.python-version }}
          path: EVIDENCE/RESULTS.md
          if-no-files-found: error
          retention-days: 14

  # GPU matrix run (peak-VRAM / long-context) is hardware-gated and not run in CI.
  # See src/routemap_matrix/HANDOFF.md to run it on an Ampere-class GPU.
